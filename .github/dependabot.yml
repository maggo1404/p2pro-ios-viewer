version: 2
updates:
  # Python-Abhängigkeiten aus requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  # Versionen der Actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "20:00"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
